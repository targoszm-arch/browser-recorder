<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head><body class="popup">
  <main><h1>Workflow Recorder</h1><p class="muted">Capture actions, step screenshots and spoken narration as text.</p>
  <label>Recording title<input id="title" placeholder="e.g. Approve an invoice"></label>
  <label class="check"><input id="voice" type="checkbox" checked> Transcribe voice narration while recording</label>
  <button id="toggle">Start recording</button><button id="review" class="secondary">Open latest recording</button>
  <p id="status" role="status"></p>
  <button id="forceReset" class="link-button hidden">Recorder stuck? Force stop &amp; save</button>
  <p class="foot">Shortcut: Alt + Shift + R</p></main><script src="popup.js"></script></body></html>
